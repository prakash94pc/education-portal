name: Deploy to AWS EC2

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
      
      - name: Deploy code to EC2
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            # Clone or pull repository
            if [ -d "/var/www/html/education-portal/.git" ]; then
              cd /var/www/html/education-portal
              sudo git pull https://github.com/${{ github.repository }}.git main
            else
              sudo git clone https://github.com/${{ github.repository }}.git /var/www/html/education-portal
            fi
            
            # Set permissions
            sudo chown -R www-data:www-data /var/www/html/education-portal
            sudo chmod -R 755 /var/www/html/education-portal
            
            # Create Apache virtual host configuration
            sudo tee /etc/apache2/sites-available/education-portal.conf > /dev/null << 'APACHEEOF'
            <VirtualHost *:80>
                DocumentRoot /var/www/html/education-portal
                <Directory /var/www/html/education-portal>
                    Options Indexes FollowSymLinks
                    AllowOverride All
                    Require all granted
                </Directory>
                ErrorLog ${APACHE_LOG_DIR}/error.log
                CustomLog ${APACHE_LOG_DIR}/access.log combined
            </VirtualHost>
            APACHEEOF
            
            # Enable the site and restart Apache
            sudo a2dissite 000-default.conf 2>/dev/null || true
            sudo a2ensite education-portal.conf
            sudo systemctl restart apache2
            
            echo "Deployment completed successfully!"
          EOF
      
      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            echo "=== Apache status ==="
            sudo systemctl status apache2 --no-pager | grep Active
            echo ""
            echo "=== Files in document root ==="
            ls -la /var/www/html/education-portal/ | head -10
          EOF
